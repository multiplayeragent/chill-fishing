<title>Chill Fishing</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #f0a07a; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }

  .tag .name { font: 700 13px system-ui, sans-serif; color: #fff; text-shadow: 0 1px 3px #000a; padding: 2px 6px; white-space: nowrap; }
  .tag .bubble { max-width: 190px; padding: 6px 10px; margin-bottom: 4px; border-radius: 14px; background: #fff; color: #2a2238; font: 600 14px/1.3 system-ui, sans-serif; box-shadow: 0 3px 8px #0003; text-align: center; overflow-wrap: anywhere; position: relative; }

  .tag .bubble:empty { display: none; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 3px #000b; }
  #net { top: max(10px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); font-size: 12px; font-weight: 600; opacity: .9; }
  #log { top: calc(max(10px, env(safe-area-inset-top)) + 20px); left: max(12px, env(safe-area-inset-left)); width: min(330px, calc(100vw - 196px)); font-size: 13px; }
  #log div { margin-top: 2px; } #log b { font-weight: 800; }
  #event { top: calc(max(10px, env(safe-area-inset-top)) + 58px); right: max(12px, env(safe-area-inset-right)); max-width: 60vw; padding: 4px 10px; border-radius: 10px; background: #ffc83dd9; color: #3a2400; font-size: 13px; font-weight: 800; text-shadow: none; }
  #event:empty { display: none; }
  #top { position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); display: flex; gap: 8px; }
  #status { left: 16px; right: 16px; top: 24%; text-align: center; font-size: 24px; font-weight: 800; transition: opacity .25s; }

  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.12); } }

  #toast.on { opacity: 1; }
  #meter { left: 50%; transform: translateX(-50%); bottom: calc(max(12px, env(safe-area-inset-bottom)) + 178px); width: min(300px, calc(100vw - 48px)); }
  #meter .lbl { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; margin-bottom: 3px; }
  .bar { position: relative; height: 18px; border-radius: 10px; border: 2px solid #fffc; background: #0005; overflow: hidden; box-sizing: border-box; }
  #powerFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #ffd27a, #ff8a4c 70%, #ff4d6d); }
  #tensionBar { background: linear-gradient(90deg, #52d273 0 55%, #ffd23f 55% 80%, #ff4d4d 80%); }
  #needle { position: absolute; top: -2px; bottom: -2px; width: 6px; margin-left: -3px; border-radius: 3px; background: #fff; box-shadow: 0 0 6px #000a; left: 0; }
  #lineBar { margin-top: 6px; height: 12px; background: #2a5a7acc; }
  #fishDot { position: absolute; top: -5px; font-size: 16px; margin-left: -9px; left: 100%; text-shadow: none; }
  #act { position: fixed; right: max(14px, env(safe-area-inset-right)); bottom: calc(max(12px, env(safe-area-inset-bottom)) + 64px); width: 96px; height: 96px; border-radius: 50%;
         border: 3px solid #fff; background: radial-gradient(circle at 35% 30%, #ffb27a, #ff7a45); color: #fff; font: 900 16px system-ui, sans-serif; text-shadow: 0 1px 2px #0006;
         box-shadow: 0 4px 14px #0005; touch-action: none; cursor: pointer; }
  #act.on { transform: scale(.94); filter: brightness(1.15); }
  #act.bite { background: radial-gradient(circle at 35% 30%, #fff38a, #ffc21a); color: #5a3a00; text-shadow: none; }
  #spots { position: fixed; left: max(14px, env(safe-area-inset-left)); bottom: calc(max(12px, env(safe-area-inset-bottom)) + 64px); display: flex; gap: 8px; }
  #bar { position: fixed; left: max(12px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom)); display: flex; gap: 8px; width: min(460px, calc(100vw - 24px)); }
  button.r { min-width: 48px; min-height: 48px; border: 0; border-radius: 14px; background: #ffffffe0; color: #2a2238; font: 700 19px system-ui, sans-serif; box-shadow: 0 2px 6px #0003; cursor: pointer; touch-action: manipulation; }
  #say { flex: 1; min-width: 0; height: 48px; border: 0; border-radius: 14px; padding: 0 14px; font: 500 16px system-ui, sans-serif; background: #ffffffe0; box-shadow: 0 2px 6px #0003; outline: none; color: #2a2238; }
  #wheel { position: fixed; inset: 0; display: grid; place-items: center; background: #0003; }
  #wheel div { position: relative; width: 240px; height: 240px; border-radius: 50%; background: #ffffffcc; box-shadow: 0 6px 20px #0004; }
  #wheel button { position: absolute; width: 84px; height: 84px; margin: -42px; border: 0; border-radius: 50%; background: #fff; font: 700 13px system-ui, sans-serif; color: #2a2238; box-shadow: 0 2px 6px #0003; cursor: pointer; }
  #wheel button span { display: block; font-size: 30px; line-height: 1.1; }
  .panel { position: fixed; inset: 0; display: grid; place-items: center; background: #2a183a66; }
  .card { width: min(380px, calc(100vw - 32px)); max-height: 86vh; overflow: auto; box-sizing: border-box; padding: 18px; border-radius: 18px; background: #fffaf4; color: #2a2238; box-shadow: 0 10px 30px #0005; text-shadow: none; }
  .card h2 { margin: 0 0 8px; font-size: 21px; }
  .card h3 { margin: 14px 0 4px; font-size: 14px; color: #b0562e; }
  .card ol { margin: 0; padding-left: 26px; font-size: 14px; text-align: left; }
  .card li span { float: right; font-variant-numeric: tabular-nums; }
  .card li.me { color: #d0562e; font-weight: 800; }
  .card p { margin: 6px 0; font-size: 14px; color: #5a5068; }
  .card label { display: block; margin: 12px 0 6px; font-size: 13px; font-weight: 700; color: #6a6078; }
  .card input { width: 100%; box-sizing: border-box; height: 44px; border: 2px solid #eadfd6; border-radius: 12px; padding: 0 12px; font: 600 16px system-ui, sans-serif; }
  .go { width: 100%; min-height: 48px; margin-top: 14px; border: 0; border-radius: 14px; background: #ff7a45; color: #fff; font: 800 17px system-ui, sans-serif; cursor: pointer; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opts button { min-width: 44px; min-height: 44px; border-radius: 12px; border: 3px solid #eee3da; background: #f8f1ea; font-size: 22px; padding: 0 6px; cursor: pointer; }
  .opts button.on { border-color: #2a2238; }
  #catchCard { text-align: center; }
  #catchCard canvas { width: 100%; aspect-ratio: 2 / 1; border-radius: 14px; background: radial-gradient(circle, #fff3dc, #ffe1c2); }
  #catchName { font-size: 23px; font-weight: 900; margin-top: 6px; }
  .chip { display: inline-block; padding: 2px 10px; border-radius: 10px; color: #fff; font-size: 12px; font-weight: 800; letter-spacing: .04em; }
  #catchKg { font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; margin: 4px 0; }
  #catchTags span { display: inline-block; margin: 2px 3px; padding: 3px 9px; border-radius: 10px; background: #ffe4b8; color: #8a4a12; font-size: 13px; font-weight: 800; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .fish { padding: 6px; border-radius: 12px; background: #f6ece2; text-align: center; font-size: 12px; line-height: 1.25; }
  .fish canvas { width: 100%; aspect-ratio: 2 / 1; }
  .fish b { display: block; font-size: 12px; } .fish i { font-style: normal; color: #7a6e86; }
  @media (max-width: 520px) { #toast { top: auto; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 240px); font-size: 15px; } #status { font-size: 21px; } }
  [hidden] { display: none !important; }
  .attract .hud, .attract #top, .attract #bar, .attract #spots, .attract #act, .attract .tag .name { display: none !important; }
</style>

<body>
<div id="tags"></div>
<div class="hud" id="net">Connecting…</div>
<div class="hud" id="log"></div>
<div class="hud" id="event"></div>
<div class="hud" id="toast"></div>
<div class="hud" id="status"></div>
<div class="hud" id="meter" hidden>
  <div class="lbl"><span id="meterL"></span><span id="meterR"></span></div>
  <div class="bar" id="powerBar"><div id="powerFill"></div></div>
  <div class="bar" id="tensionBar"><div id="needle"></div></div>
  <div class="bar" id="lineBar"><span id="fishDot">🐟</span></div>
</div>
<div id="top"><button class="r" id="logBtn" title="Fish log">📖</button><button class="r" id="boardBtn" title="Biggest catches">🏆</button><button class="r" id="lookBtn" title="Your look">👕</button></div>

</div></div>

</div></div>

  <label>Color</label><div class="opts" id="colorOpts"></div>
  <label>Hat</label><div class="opts" id="hatOpts"></div>
  <button class="go" id="lookGo">Done</button>
</div></div>
<script type="module">
/* ═══ CHILL FISHING · a Multiplayer Agent starter ═══════════════════════════════════════
 * Cast, wait for the bobber, reel it in. Drop-in, 2–16 players; friendly bots fish beside you.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ timings, how the reel feels, bots, colors, hats, the bots' lines
 *   FISH .......... the 12 species and 5 rarities, how a bite picks a fish, the fish drawings
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host, live ops
 *   LAKE .......... sky, sun, water, the dock and its 16 spots, the shore, ripples and sparkles
 *   ANGLERS ....... the avatar, rod, line and bobber; pose() turns a fishing state into a picture
 *   BOTS (HOST) ... bots fishing, chatting and giving way to people. Only the host runs them.
 *   ME ............ casting, the bite, reeling against the tension meter, walking between spots
 *   SAVES ......... your fish log (a player save) and the biggest-catch leaderboard
 *   CHAT & PANELS . chat log, bubbles, emotes, the catch card, fish log, leaderboard, your look
 *   INPUT ......... the big button, Space, mouse and touch, spot arrows, keys
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Fishing is personal: your bites, your reel and your catch happen in your own browser,
 *     so there is nothing shared to fight over and nothing for a host to decide.
 *   - Each player writes its OWN entity: `a` (one JSON field: spot, position, facing, emote,
 *     and the fishing state with its start time, bobber spot, line length and the fish) when
 *     it changes and ~10 times a second while reeling; `look` (name, color, hat); `say` (your
 *     last chat line, so people who arrive later still see it) and `hb` (heartbeat) once a second.
 *   - Everyone draws everyone from those states: the cast arc, the nibbles, the bite and the
 *     fish held up are worked out from the state's start time, so all screens agree.
 *   - A chat line is also an event, "chat" {t, k}, so everyone gets it at once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared field `bots` (each bot's spot,
 *     look, fishing state with timestamps, and last line). A new host adopts the bots with
 *     their timestamps and carries on from real time.
 *   - Spots: each angler stands on one of 16 spots. Two people on one spot: the one with the
 *     higher sessionId moves on. Bots give way to people.
 *   - Saves: your fish log is a player save (namespace CONFIG.saveNs); offline, this browser.
 *   - Leaderboard "biggest-catch": each player's heaviest fish, in grams.
 *   - Live ops: `rareBoost` and `biteWindowMs` can be changed live; running events show top right.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 6,                 // bots fill the dock up to this many anglers (10 bots at most fit in their shared field)
  board: "biggest-catch",   // leaderboard: each player's heaviest fish, in grams
  saveNs: "chill-fishing",  // player-save namespace for your fish log
  powerHz: 0.8,             // the cast meter swings full and back this many times a second
  castMin: 7, castMax: 25,  // how far the bobber lands at no power and full power
  flightMs: 650,            // ms the bobber flies
  waitMs: [2500, 8000],     // ms from the bobber landing to the bite
  biteWindowMs: 900,        // ms you have to hook it after the bobber dunks
  reelSpeed: 0.24,          // share of the line you reel in per second
  slackPull: 0.05,          // share of the line the fish takes back per second while you let go
  tensionRise: 0.12,        // tension per second while reeling a calm fish...
  runRise: 1.5,             // ...and while it is pulling (plus up to 1 more for a fighter)
  tensionFall: 0.9,         // tension per second while you let go
  snapAfterMs: 380,         // ms in the red before the line snaps
  holdMs: 2800,             // ms you hold your catch up for everyone to see
  rareBoost: 1,             // multiplies the odds of Rare and better (live ops can raise it)
  walkSpeed: 4.5,
  bubbleMs: 7000, chatGapMs: 900,
  botWaitMs: [3000, 9000], botReelMs: [2500, 5500], botCatch: 0.72, botTalk: [9000, 20000],
  botLines: ["The lake is so calm tonight", "Look at that sunset 🌅", "Anyone caught a Moonfin yet?", "Patience is the whole trick 🎣",
    "Far casts find the rare ones", "Let go when it pulls, or snap!", "I could fish here all evening", "Shh… I think I've got a nibble",
    "My grandpa fished off this dock", "Fireflies are out ✨", "Ghost Koi like the deep water", "This is my lucky spot"],
  greet: ["Hi {name}! 👋 Grab a spot", "Welcome to the dock, {name}!", "Hey {name}, the fish are biting 🎣"],
  cheer: ["Whoa, a {fish}! 🤩", "Nice {fish}, {name}!", "Is that a {fish}?! 👏", "Great catch, {name}!"],
  camDist: 7.5, camHeight: 4.6,
};
const BOT_NAMES = ["Pip", "Marlo", "Juniper", "Biscuit", "Hazel", "Otis", "Clover", "Nova", "Pebble", "Willow", "Tofu", "Rusty", "Bean", "Ziggy", "Sunny", "Mochi"];
const COLORS = ["#ff7a59", "#4da6ff", "#ffd23f", "#52d273", "#c77dff", "#ff6fb5", "#3de0d0", "#a0785a", "#ff4d6d", "#8bd450", "#ffa94d", "#7b8cff", "#f2f2f2", "#2fb7a0", "#e05ad1", "#5a6b8c"];
const HATS = { bucket: "🎣", cap: "🧢", straw: "👒", beanie: "🧶", party: "🥳", none: "🚫" };
const EMOTES = { wave: "👋", cheer: "🙌", dance: "💃", sit: "🪑" };

// ── FISH ────────────────────────────────────────────────────────────────────────────
// r = rarity, kg = weight range, c = [back, belly, fins], pat = pattern, shape = body,
// fight = how hard it pulls (0–1), deep = the cast distance it likes (0 near, 1 far).
const FISH = [
  { id: "perch",   name: "Sunny Perch",    r: 0, kg: [0.2, 0.9], c: ["#d9952e", "#fbe7a6", "#e2683c"], pat: "bars",    shape: "round",   fight: 0.2, deep: 0 },
  { id: "minnow",  name: "Reed Minnow",    r: 0, kg: [0.05, 0.3], c: ["#7fa89c", "#eef4ea", "#9cc4b8"], pat: "line",   shape: "slim",    fight: 0.1, deep: 0.1 },
  { id: "carp",    name: "Mud Carp",       r: 0, kg: [1, 4.5], c: ["#8c7a4c", "#e3d2a0", "#a5854b"], pat: "scales",    shape: "round",   fight: 0.4, deep: 0.3 },
  { id: "bass",    name: "Striped Bass",   r: 1, kg: [0.8, 3.2], c: ["#5d7f5a", "#e6eadc", "#4e6b48"], pat: "stripes", shape: "long",    fight: 0.5, deep: 0.4 },
  { id: "trout",   name: "Rainbow Trout",  r: 1, kg: [0.5, 2.6], c: ["#7c9a7a", "#f6efe4", "#e88aa0"], pat: "rainbow", shape: "long",    fight: 0.5, deep: 0.5 },
  { id: "catfish", name: "Copper Catfish", r: 1, kg: [1.5, 7], c: ["#b0703a", "#f0d6b4", "#8a5228"], pat: "plain",     shape: "whisker", fight: 0.6, deep: 0.6 },
  { id: "koi",     name: "Ghost Koi",      r: 2, kg: [1, 5], c: ["#f4f1ea", "#ffffff", "#f08a4b"], pat: "patches",     shape: "round",   fight: 0.5, deep: 0.5 },
  { id: "pike",    name: "Spotted Pike",   r: 2, kg: [2, 9], c: ["#556b3b", "#dfe5c2", "#7d8f45"], pat: "spots",       shape: "slim",    fight: 0.75, deep: 0.7 },
  { id: "lantern", name: "Lanternfish",    r: 2, kg: [0.3, 1.2], c: ["#283a6b", "#6b84c9", "#ffd36b"], pat: "glow",    shape: "round",   fight: 0.45, deep: 0.9 },
  { id: "sunfish", name: "Golden Sunfish", r: 3, kg: [1.5, 6], c: ["#f4b81c", "#ffe58a", "#ff8c1a"], pat: "shine",     shape: "disc",    fight: 0.7, deep: 0.6 },
  { id: "eel",     name: "Twilight Eel",   r: 3, kg: [1, 5.5], c: ["#4b2f6e", "#a98bd6", "#ff7ab6"], pat: "line",      shape: "eel",     fight: 0.85, deep: 0.85 },
  { id: "moonfin", name: "Moonfin",        r: 4, kg: [3, 12], c: ["#9fb8f0", "#ffffff", "#7fa0ff"], pat: "stars",      shape: "fancy",   fight: 1, deep: 1 },
];
const RARITY = [
  { name: "Common", color: "#8f9bab", w: 60 }, { name: "Uncommon", color: "#3fbf62", w: 26 }, { name: "Rare", color: "#3b8fe8", w: 10 },
  { name: "Epic", color: "#a85de0", w: 3.2 }, { name: "Legendary", color: "#f0a800", w: 0.8 },
];
/** Which fish bit: rarer with a far cast (depth 0–1). `rand` is Math.random or a seeded one. */
function rollFish(depth, rand) {
  const weights = RARITY.map((r, i) => r.w * (1 + depth * i * 0.9) * (i >= 2 ? liveCfg("rareBoost") : 1));
  let x = rand() * weights.reduce((a, b) => a + b, 0), r = 0;
  while (x > weights[r] && r < RARITY.length - 1) x -= weights[r++];
  const pool = FISH.map((f, i) => ({ f, i })).filter((o) => o.f.r === r), fw = pool.map((o) => 1.2 - Math.abs(o.f.deep - depth));
  let y = rand() * fw.reduce((a, b) => a + b, 0), k = 0;
  while (y > fw[k] && k < pool.length - 1) y -= fw[k++];
  const f = pool[k].f, kg = f.kg[0] + (f.kg[1] - f.kg[0]) * Math.min(1, Math.pow(rand(), 1.8) + depth * 0.12);
  return { f: pool[k].i, kg: Math.round(kg * 100) / 100 };
}
const an = (word) => (/^[AEIOU]/i.test(word) ? "an " : "a ") + word;
const kgText = (kg) => (kg < 1 ? Math.round(kg * 1000) + " g" : kg.toFixed(2) + " kg");

// The fish drawings: one canvas routine, used for the catch card, the log and the 3D sprites.
const SHAPES = { // h = body height / length, t = tail size, fin = top fin size
  slim: { h: 0.3, t: 0.9, fin: 0.7 }, long: { h: 0.36, t: 1, fin: 0.9 }, round: { h: 0.52, t: 0.9, fin: 1 }, disc: { h: 0.75, t: 0.8, fin: 1.1 },
  eel: { h: 0.17, t: 0.5, fin: 0.45 }, whisker: { h: 0.36, t: 0.9, fin: 0.8 }, fancy: { h: 0.46, t: 1.5, fin: 1.7 },
};
function drawFish(c, f, W, H, dark) {
  const sh = SHAPES[f.shape], x0 = W * 0.22, x1 = W * 0.95, L = x1 - x0, cy = H * 0.52, hh = Math.min(H * 0.3, (L * sh.h) / 2);
  const ink = dark ? "#3a3f55" : null, [back, belly, fin] = f.c, seeded = mulberry32(f.id.length * 97 + f.id.charCodeAt(0));
  c.save(); c.lineJoin = "round";
  if (!dark && f.r >= 3) { c.shadowColor = fin; c.shadowBlur = W * 0.06; }
  // fins first, so the body covers their roots
  const fs = hh * sh.fin * 0.75, ts = Math.min(hh * sh.t * 1.3, x0 * 0.95, H * 0.46);
  c.fillStyle = ink || fin;

  const id = FISH[f].id, grams = Math.round(kg * 1000), entry = save.log[id] || [0, 0], result = { isNew: !entry[0], isBest: grams > entry[1], isRecord: grams > save.best };
  if (ATTRACT) return result;
  save.log[id] = [entry[0] + 1, Math.max(entry[1], grams)]; save.total++;
  if (result.isRecord) { save.best = grams; save.bestF = id; }

}
async function saveNow() {
  save.at = Date.now(); localSave.set(save);
  if (!player) return;
  try { await player.data.set(save, { namespace: CONFIG.saveNs }); }
  catch (e) { if (e && e.current) player.data.set(save, { namespace: CONFIG.saveNs, version: e.current.version }).catch(() => {}); } // another device saved in between: ours is newer
}
async function loadAccountSave() {
  try { const r = await player.data.get(CONFIG.saveNs); if (r && r.data && r.data.v === 1 && r.data.at > save.at) applySave(r.data); } catch {}
}
function showBoard() {

  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}

// ── CHAT & PANELS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);

const touch = matchMedia("(pointer: coarse)").matches;
const heard = new Map(), lines = []; // heard: id -> last chat k shown
function lookOf(id) { const p = S.entities.players[id]; return field("look:" + id, p && p.look, {}); }
/** Show a line: a bubble over the angler and a row in the log. */

}
function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 3200); }
function sendChat() {
  const input = $("say"), text = input.value.trim().slice(0, 80), now = performance.now();
  input.value = ""; input.blur();
  if (!text || now - me.lastSay < CONFIG.chatGapMs) return;
  me.lastSay = now; me.sayK++;
  net.send("chat", { t: text, k: me.sayK });
  net.me.set("say", JSON.stringify({ t: text, k: me.sayK }));

}
function emote(e) { me.e = e; me.ek++; if (e === "dance" && !["idle", "hold", "lost"].includes(me.st)) setState("idle", { f: -1 }); $("wheel").hidden = true; publish(true); }
function showCatch(f, kg, result) {
  const fish = FISH[f], rare = RARITY[fish.r], cv = $("catchFish"), c = cv.getContext("2d");
  c.clearRect(0, 0, cv.width, cv.height); drawFish(c, fish, cv.width, cv.height, false);

  $("catchRarity").textContent = rare.name.toUpperCase(); $("catchRarity").style.background = rare.color;

  $("catchTags").innerHTML = [result.isNew && "📖 New in your log!", result.isRecord && "🏆 Your biggest ever!", !result.isRecord && result.isBest && "⭐ Your biggest " + fish.name].filter(Boolean).map((t) => `<span>${t}</span>`).join("");
  $("catchRank").textContent = ""; $("catchTop").hidden = true;
  if (result.isRecord && board) { // a personal best: submit it, then show where it puts you
    board.submit(Math.round(kg * 1000)).then((r) => { if (r && r.rank) $("catchRank").textContent = `#${r.rank} of ${r.total} on the biggest-catch board`; return board.top(10); })
      .then(({ entries }) => { $("catchBoard").innerHTML = entries.map((e) => `<li>${esc(e.username || "Player")}<span>${kgText(e.score / 1000)}</span></li>`).join(""); $("catchTop").hidden = !entries.length; }).catch(() => {});
  }

}
function openLog() {
  const caught = FISH.filter((f) => save.log[f.id]).length;
  $("logSub").textContent = `${caught} of ${FISH.length} species · ${save.total} fish landed`;
  $("logGrid").innerHTML = FISH.map((f, i) => { const e = save.log[f.id]; return `<div class="fish"><canvas width="160" height="80" data-i="${i}"></canvas><b style="color:${e ? RARITY[f.r].color : "#9a90a6"}">${e ? esc(f.name) : "???"}</b><i>${e ? `×${e[0]} · best ${kgText(e[1] / 1000)}` : RARITY[f.r].name}</i></div>`; }).join("");
  for (const cv of $("logGrid").querySelectorAll("canvas")) drawFish(cv.getContext("2d"), FISH[+cv.dataset.i], cv.width, cv.height, !save.log[FISH[+cv.dataset.i].id]);
  $("logPanel").hidden = false;

function saveLook() { net.me.set("look", JSON.stringify(myLook)); keep("mpa-name", myLook.n); keep("chill-fishing.look", JSON.stringify({ hat: myLook.hat })); }
function openLook() {
  $("nameIn").value = myLook.n;
  const opts = (el, list, key, label) => { el.innerHTML = list.map((v) => `<button data-v="${v}" class="${myLook[key] === v ? "on" : ""}" ${key === "c" ? `style="background:${v}"` : ""}>${label(v)}</button>`).join("");
    for (const b of el.children) b.onclick = () => { myLook.n = $("nameIn").value.trim().slice(0, 16) || myLook.n; myLook[key] = b.dataset.v; openLook(); saveLook(); }; };
  opts($("colorOpts"), COLORS, "c", () => ""); opts($("hatOpts"), Object.keys(HATS), "hat", (h) => HATS[h]);
  $("lookPanel").hidden = false;

let audio = null;
function sfx(freq, dur, type = "square", vol = 0.04, slideTo = 0) {
  if (!audio || ATTRACT) return;
  try {
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t); if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);
  } catch {}
}
function sfxSplash(vol) {
  if (!audio || ATTRACT) return;
  try {
    const n = audio.createBuffer(1, audio.sampleRate * 0.35, audio.sampleRate), d = n.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
    const s = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
    s.buffer = n; f.type = "lowpass"; f.frequency.value = 1400; g.gain.value = vol; s.connect(f).connect(g).connect(audio.destination); s.start();
  } catch {}
}
function sfxFanfare(r, vol) { [523, 659, 784, 1047, 1319].slice(0, 2 + r).forEach((f, i) => setTimeout(() => sfx(f, 0.22, "triangle", 0.05 * vol), i * 90)); }

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const wheel = $("wheel").firstElementChild;
Object.entries(EMOTES).forEach(([e, icon], i) => {
  const b = document.createElement("button"), a = (i / 4) * Math.PI * 2 - Math.PI / 2;
  b.innerHTML = `<span>${icon}</span>${e}`; b.style.left = 120 + Math.cos(a) * 78 + "px"; b.style.top = 120 + Math.sin(a) * 78 + "px";
  b.onclick = (ev) => { ev.stopPropagation(); emote(e); }; wheel.appendChild(b);
});
const wakeAudio = () => { if (!audio) try { audio = new AudioContext(); } catch {} else if (audio.state === "suspended") audio.resume(); };
$("wheel").onclick = () => { $("wheel").hidden = true; };
$("emoteBtn").onclick = () => { $("wheel").hidden = !$("wheel").hidden; };
$("say").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); sendChat(); } if (e.key === "Escape") $("say").blur(); e.stopPropagation(); });
$("logBtn").onclick = openLog; $("logClose").onclick = () => { $("logPanel").hidden = true; };
$("boardBtn").onclick = () => { showBoard(); $("boardPanel").hidden = false; }; $("boardClose").onclick = () => { $("boardPanel").hidden = true; };
$("lookBtn").onclick = openLook; $("lookGo").onclick = () => { myLook.n = $("nameIn").value.trim().slice(0, 16) || myLook.n; saveLook(); $("lookPanel").hidden = true; };
$("catchGo").onclick = () => { $("catchPanel").hidden = true; };
$("prevSpot").onclick = () => stepSpot(-1); $("nextSpot").onclick = () => stepSpot(1);
const actBtn = $("act");
actBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); actBtn.setPointerCapture(e.pointerId); press(e.timeStamp); wakeAudio(); });
for (const ev of ["pointerup", "pointercancel"]) actBtn.addEventListener(ev, () => release());
addEventListener("keydown", (e) => {
  if (typing()) return;
  const k = e.key.toLowerCase();
  if (k === " ") { e.preventDefault(); if (!e.repeat) { press(e.timeStamp); wakeAudio(); } return; }
  if (k === "enter") { e.preventDefault(); $("say").focus(); return; }
  if (k === "escape") { for (const p of ["catchPanel", "logPanel", "boardPanel", "lookPanel"]) $(p).hidden = true; $("wheel").hidden = true; }
  if ("1234".includes(k) && k.length === 1) emote(Object.keys(EMOTES)[+k - 1]);
  if (k === "e") $("wheel").hidden = !$("wheel").hidden;
  if (k === "a" || k === "arrowleft") stepSpot(-1);
  if (k === "d" || k === "arrowright") stepSpot(1);
  if (k === "l") openLog();
});
addEventListener("keyup", (e) => { if (e.key === " ") release(); });
addEventListener("blur", () => release());
// The water works like the big button; a tap on a free spot's ring walks you there.
const cv = renderer.domElement, ray = new THREE.Raycaster(), deckPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -DECK), hit = new THREE.Vector3();
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault(); $("say").blur(); wakeAudio();
  ray.setFromCamera({ x: (e.clientX / innerWidth) * 2 - 1, y: -(e.clientY / innerHeight) * 2 + 1 }, camera);
  if (ray.ray.intersectPlane(deckPlane, hit)) { const s = SPOTS.findIndex((sp, i) => spotRings[i].visible && Math.hypot(sp.x - hit.x, sp.z - hit.z) < 1.1); if (s >= 0) return moveTo(s); }
  press(e.timeStamp);
});
for (const ev of ["pointerup", "pointercancel"]) cv.addEventListener(ev, () => release());
cv.addEventListener("wheel", (e) => { CONFIG.camDist = clamp(CONFIG.camDist + e.deltaY * 0.01, 4.5, 14); }, { passive: true });
document.addEventListener("touchmove", (e) => { if (e.target === cv || e.target === actBtn) e.preventDefault(); }, { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
const camLook = new THREE.Vector3();
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)), t = now / 1000; last = now;
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); fixSpot(); }
  if (isHost()) hostTick(dt, now); else host.was = false;
  if (ATTRACT) autopilot(now);
  walkTick(dt); fishTick(dt); publish(false);
  animateWater(t);
  // Everyone: people from their entities, bots from the host, me from my own state.
  const seen = new Set([net.sessionId]), live = new Set(livePlayers());
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    if (id === net.sessionId || !live.has(id)) continue;
    const a = field("a:" + id, p.a, null); if (!a) continue;
    const said = field("say:" + id, p.say, null), look = lookOf(id), v = viewOf(id);
    v.name = String(look.n ?? "Player");
    if (said && said.k > (heard.get(id) || 0)) { heard.set(id, said.k); bubble(id, v.name, look.c || "#ccc", String(said.t)); }
    seen.add(id); show(v, a, dt, now, t, { n: v.name, c: look.c, hat: look.hat });
  }
  for (const b of botList()) {
    const v = viewOf(b.i); v.name = b.n;
    if (b.say && b.say.k > (heard.get(b.i) || 0)) { const first = !heard.has(b.i); heard.set(b.i, b.say.k); if (!isHost() && b.say.t) bubble(b.i, b.n, b.c, b.say.t, !first); }
    seen.add(b.i); show(v, { ...b, d: 1 }, dt, now, t, { n: b.n, c: b.c, hat: b.hat });
  }
  const mine = viewOf(net.sessionId); mine.name = myLook.n; setLook(mine, myLook);
  mine.speed = me.path ? CONFIG.walkSpeed : 0; mine.x = me.x; mine.z = me.z; mine.h = me.h; mine.fresh = false;
  mine.g.position.set(me.x, DECK, me.z); mine.g.rotation.y = me.h;
  animate(mine, me.e, me.ek, pose(mine, me, dt, now, t), t);
  for (const id of [...views.keys()]) if (!seen.has(id)) dropView(id);
  // free spots glow while you are not busy
  const claims = humanClaims().spots, botSpots = new Set(botList().map((b) => b.s)), idle = !ATTRACT && !me.path && ["idle", "hold", "lost"].includes(me.st);
  spotRings.forEach((r, i) => { r.visible = idle && i !== me.s && !claims.has(i) && !botSpots.has(i); r.material.opacity = 0.25 + 0.2 * Math.sin(t * 3 + i); });
  effectsTick(dt, t); jumpTick(now);
  glitTex.offset.y = (t * 0.012) % 1;
  placeCamera(dt, t);
  renderer.render(scene, camera);
  for (const v of views.values()) placeTag(v, now);
  if (now - lastHud > 100) { lastHud = now; hud(now); }
  requestAnimationFrame(frame);
}
/** Behind you, looking out over your bobber. ?attract drifts slowly along the end of the dock. */
function placeCamera(dt, t) {
  if (ATTRACT) {
    const x = Math.sin(t * 0.15 - 1.2) * 4.2;
    camera.position.set(x, 4, -11); camera.lookAt(x * 0.7, 1.5, -30);
    return;
  }
  const tall = camera.aspect < 1, d = CONFIG.camDist * (tall ? 1.5 : 1), fx = Math.sin(me.h), fz = Math.cos(me.h), side = tall ? 0.8 : 1.8; // over your right shoulder
  const want = V.set(me.x - fx * d - fz * side, DECK + CONFIG.camHeight * (tall ? 1.35 : 1), me.z - fz * d + fx * side);
  camera.position.lerp(want, 1 - Math.pow(0.002, dt));
  camLook.lerp(new THREE.Vector3(me.x + fx * 13 - fz * side * 0.5, DECK - 0.8, me.z + fz * 13 + fx * side * 0.5), 1 - Math.pow(0.002, dt));
  camera.lookAt(camLook);
}
/** Someone else, eased toward where they last said they were. */
function show(v, a, dt, now, t, look) {
  setLook(v, look);
  if (v.fresh) { v.x = a.x; v.z = a.z; v.h = a.ry; v.fresh = false; }
  const k = 1 - Math.pow(0.001, dt), px = v.x, pz = v.z;
  v.x += (a.x - v.x) * k; v.z += (a.z - v.z) * k; v.h += Math.atan2(Math.sin(a.ry - v.h), Math.cos(a.ry - v.h)) * k;
  v.speed += (Math.hypot(v.x - px, v.z - pz) / Math.max(dt, 0.001) - v.speed) * 0.2;
  v.g.position.set(v.x, DECK, v.z); v.g.rotation.y = v.h;
  animate(v, a.e || "", a.ek || 0, pose(v, a, dt, now, t), t);

let started = 0;
function hud(now) {

  if (!started) started = now;
  // the big button and the status line say what to do next
  const st = me.st, label = { idle: "CAST", hold: "CAST", lost: "CAST", charge: "LET GO", cast: "…", wait: "WAIT", bite: "HOOK!", reel: "REEL" }[st];
  if (actBtn.textContent !== label) actBtn.textContent = label;
  actBtn.classList.toggle("bite", st === "bite"); actBtn.classList.toggle("on", st === "charge" || (st === "reel" && me.reeling));
  let text = "", sub = "";
  if (performance.now() < me.msgUntil) { text = me.msg; sub = me.sub; }
  else if (me.path) text = "Walking to your spot…";
  else if (st === "idle" && now - started < 20000) { text = touch ? "Hold CAST, let go at full power" : "Hold Space (or CAST), let go at full power"; sub = "◀ ▶ or tap a glowing ring to change spots"; }
  else if (st === "charge") { text = "Let go at full power!"; sub = "Far casts reach deeper water and rarer fish"; }
  else if (st === "bite") text = "BITE! Tap now!";
  else if (st === "reel") { text = me.running ? "It's pulling! Let go!" : "Hold to reel it in"; sub = me.running ? "" : "Let go when it pulls, or the line snaps"; }
  $("status").innerHTML = text ? `${esc(text)}${sub ? `<small>${esc(sub)}</small>` : ""}` : "";
  $("status").classList.toggle("bite", st === "bite");
  // the meters
  $("meter").hidden = st !== "charge" && st !== "reel";
  $("powerBar").hidden = st !== "charge"; $("tensionBar").hidden = $("lineBar").hidden = st !== "reel";
  if (st === "charge") { $("meterL").textContent = "Power"; $("meterR").textContent = Math.round(me.power * 100) + "%"; $("powerFill").style.width = me.power * 100 + "%"; }
  if (st === "reel") {
    $("meterL").textContent = "Tension"; $("meterR").textContent = me.fish ? `${Math.max(0, Math.round(me.d * 100))}% of the line out` : "";
    $("needle").style.left = Math.min(100, me.tension * 100) + "%"; $("needle").style.background = me.tension > 0.8 ? "#ff4d4d" : "#fff";
    $("fishDot").style.left = clamp(me.d / 1.15, 0, 1) * 100 + "%"; $("fishDot").style.transform = me.running ? `translateX(${Math.sin(now / 40) * 3}px)` : "";
  }
  $("spots").style.opacity = me.st === "reel" ? 0.4 : 1;
}

(async function start() {
  document.body.classList.toggle("attract", ATTRACT);
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("chat", (msg, from) => {
    if (!msg || typeof msg.t !== "string") return;
    const look = lookOf(from), text = msg.t.slice(0, 80);
    if ((msg.k || 0) > (heard.get(from) || 0)) { heard.set(from, msg.k || 0); bubble(from, look.n || "Player", look.c || "#ccc", text); }
    maybeReply(look.n || "friend", text);
  });
  net.onDisconnect(() => { reconnecting = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { reconnecting = false; });
  net.onLive((live) => { $("event").textContent = (live && live.active || []).map((e) => "🎉 " + e.title).join(" · "); });
  // your color and spot: the first ones nobody (person or bot) has
  const claims = humanClaims(), botsNow = field("shared:bots", S.shared.bots, []);
  const taken = new Set([...claims.colors, ...botsNow.map((b) => b.c)]);
  myLook.c = COLORS.find((c) => !taken.has(c)) || pick(COLORS);
  myLook.j = Date.now(); // when you joined: settles who changes color if two players match
  me.s = ATTRACT ? 8 : PREFERRED.find((s) => !claims.spots.has(s) && !botsNow.some((b) => b.s === s)) ?? PREFERRED.find((s) => !claims.spots.has(s)) ?? 0;
  const sp = SPOTS[me.s]; me.x = sp.x; me.z = sp.z; me.h = sp.h;
  if (!ATTRACT) {
    me.x = 0; me.z = clamp(sp.az + 7, -8, 15); me.path = routeTo(me.x, me.z, me.s); // stroll down the dock to it
    applySave(localSave.get());
  }
  net.me.set({ look: JSON.stringify(myLook), hb: Date.now() }); joinedAt = performance.now();
  publish(true);
  if (!net.offline && typeof MP !== "undefined") {
    player = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }); board = player.leaderboard(CONFIG.board);
    player.getPlayer().then(loadAccountSave).catch(() => {});
  }
  camera.position.set(me.x, 6, me.z + 9); camLook.set(me.x, 0, me.z - 10);
  if (TEST) window.__test = { me, S: () => S, isHost, botList, livePlayers, press, release, moveTo, save: () => save, views };
  requestAnimationFrame(frame);
})();
